name: smoke

# The merge gate. Runs the full automated suite on every PR and on pushes to
# non-main branches. Branch protection on `main` requires this job to pass
# before a PR can merge, so broken code can't reach production.
#   sanity      — fast JS parse of every inline <script> (no browser)
#   docs-check  — fail if the docs drift from the code (version/UIMAP/links)
#   smoke       — core coach journey in headless Chromium
#   sports      — every sport/format played to summary
#   edge        — save/resume, injury, live roster edits, cadence, etc.
#   secondhalf  — the period boundary: who takes the field and who is in goal
#                 for the 2nd half, and what the Plan page shows at a break
#   flow        — record a game the way the app does, then replay it and check
#                 it reproduces step for step (proves a sent-in bug repros)
#   replay      — replay every real game flow committed under flows/ (the
#                 regression corpus of games that actually happened)
# Screenshots from all suites are uploaded as an artifact for triage.
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sanity (JS parse)
        run: npm run sanity

      - name: Docs drift check
        run: npm run docs-check

      - name: Design-system check (tokens + ratchet)
        run: npm run design

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke (core journey)
        run: npm run smoke

      - name: Sports matrix (all formats)
        run: npm run sports

      - name: Edge cases
        run: npm run edge

      - name: Second-half setup (keeper + Plan page at a break)
        run: npm run secondhalf

      - name: Game flow round-trip (record → replay)
        run: npm run flow

      - name: Replay recorded games (regression corpus)
        run: npm run replay

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
          retention-days: 14
