<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sub Timer — Live Gallery (dev)</title>
<style>
  :root{--bg:#0d1017;--card:#161b26;--ink:#e6e9f0;--dim:#7d8a9c;--accent:#00d4aa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
  header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(13,16,23,.92);backdrop-filter:blur(6px);border-bottom:1px solid #232b3b}
  header h1{font-size:14px;letter-spacing:2px;margin:0;font-weight:800}
  header .hint{color:var(--dim);font-size:12px;flex:1}
  header button{background:#1b2230;border:1px solid #2a3550;color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:700;font-size:12px;cursor:pointer}
  header button:hover{border-color:var(--accent)}
  body[data-device="phone"]{--pw:375px;--ph:812px;--fit:.5}
  body[data-device="ipad"]{--pw:768px;--ph:1024px;--fit:.4}
  #canvas{display:flex;gap:26px;align-items:flex-start;padding:26px;overflow-x:auto;min-height:60vh}
  .tile{flex:0 0 auto}
  .tile .label{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--dim);margin:0 0 8px 2px;cursor:pointer;user-select:none}
  .tile .label b{color:var(--ink)}
  .tile .label .st{color:var(--accent);font-weight:700;margin-left:6px;font-size:11px}
  .port{width:var(--pw);height:var(--ph);border-radius:18px;overflow:hidden;background:#000;border:1px solid #2a3550;box-shadow:0 12px 40px rgba(0,0,0,.5);transform-origin:top left}
  .port iframe{width:var(--pw);height:var(--ph);border:0;display:block}
  body[data-zoom="fit"] .port{transform:scale(var(--fit));margin-bottom:calc(var(--ph) * (var(--fit) - 1))}
  body[data-zoom="fit"] .tile{width:calc(var(--pw) * var(--fit))}
  body[data-zoom="full"] .port{transform:none;margin-bottom:0}
  body[data-zoom="full"] .tile{width:var(--pw)}
  .port{position:relative}
  .grid{position:absolute;inset:0;pointer-events:none;display:none;z-index:10}
  body[data-grid="on"] .grid{display:block}
  /* 8px baseline grid */
  .grid .baseline{position:absolute;inset:0;
    background-image:repeating-linear-gradient(to bottom,rgba(91,192,222,.14) 0 1px,transparent 1px 8px)}
  /* 16px side margins */
  .grid .margins{position:absolute;inset:0;
    background-image:linear-gradient(to right,transparent 15px,rgba(233,69,96,.55) 15px 16px,transparent 16px calc(100% - 16px),rgba(233,69,96,.55) calc(100% - 16px) calc(100% - 15px),transparent calc(100% - 15px))}
  /* key horizontal guide lines from the nav constitution */
  .grid .line{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(0,212,170,.8)}
  .grid .line span{position:absolute;right:2px;top:-14px;font-size:9px;font-weight:800;letter-spacing:.5px;color:#00d4aa;background:rgba(13,16,23,.75);padding:1px 4px;border-radius:3px}
  .grid .line.amber{border-top-color:rgba(240,165,0,.85)}
  .grid .line.amber span{color:#f0a500}
</style>
</head>
<body data-zoom="fit" data-device="phone">
<header>
  <h1>SUB TIMER · LIVE GALLERY</h1>
  <span class="hint">Every tile is the real app — tap, type, play. Zoom toggles size; Reset wipes storage and reboots all tiles.</span>
  <button onclick="toggleZoom()">Zoom</button>
  <button onclick="toggleGrid()">Grid</button>
  <button id="devBtn" onclick="toggleDevice()">iPad</button>
  <button onclick="resetAll()">Reset all</button>
</header>
<div id="canvas"></div>
<div style="padding:0 26px 8px"><h2 style="font-size:12px;letter-spacing:2px;color:var(--dim);margin:0">ELEMENTS · LIVE CONTROL FAMILIES — rendered by the app's own CSS</h2></div>
<div id="elements" style="padding:0 26px 40px"><iframe id="elFrame" src="index.html" style="width:100%;height:560px;border:1px solid #2a3550;border-radius:14px;background:#1a1a2e"></iframe></div>
<script>
// Each state drives the same journey functions the test harness uses
// (mirrors test/screen-audit.mjs / the figma-atlas shoot script).
const wait = (ms) => new Promise(r => setTimeout(r, ms));
// Drivers run via contentWindow.eval so they share the app's top-level
// lexical scope (teams / G / currentTeam are `let` bindings — not on window).
const ENSURE = `
  (() => {
    const t = teams.find(t => t.name === 'Gallery');
    if (t) return t.id;
    newTeam(); pickSport('soccer'); pickFormat('7v7', 'soccer'); fillSampleSquad();
    document.getElementById('teamNameInput').value = 'Gallery';
    saveAndBack();
    return teams[teams.length - 1].id;
  })()`;
const SELECT = `selectTeam(${ENSURE});`;
const TO_GAME = SELECT + `startFromSquad(); gkStepNext(); shapeStepNext();`;
const STATES = [
  ['01 · Home / landing', ''],
  ['02 · Sport picker', 'newTeam();'],
  ['03 · Format picker', "newTeam(); pickSport('soccer');"],
  ['04 · Team editor', "newTeam(); pickSport('soccer'); pickFormat('7v7','soccer'); fillSampleSquad();"],
  ['05 · Squad select', SELECT],
  ['06 · Keeper page', SELECT + 'startFromSquad();'],
  ['07 · Shape page', SELECT + 'startFromSquad(); gkStepNext();'],
  ['08 · Live game', TO_GAME],
  ['09 · Announce', TO_GAME + 'openAnnounce();'],
  ['10 · Plan page', TO_GAME + "switchToView('plan');"],
  ['11 · Summary', TO_GAME + 'G.half = getSport(currentTeam).periodCount; advH();'],
  ['12 · History', SELECT + 'showHistory();'],
  ['13 · Team settings', SELECT + "switchToView('settings');"],
];

async function boot() {
  const canvas = document.getElementById('canvas');
  for (const [label, drive] of STATES) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `<div class="label" title="Click to zoom this tile"><b>${label}</b><span class="st">booting…</span></div>
      <div class="port"><iframe src="index.html"></iframe>
        <div class="grid">
          <div class="baseline"></div>
          <div class="margins"></div>
          <div class="line" style="top:44px"><span>brand bar 44</span></div>
          <div class="line amber" style="bottom:58px"><span>zone 58</span></div>
          <div class="line amber" style="bottom:132px"><span>action row</span></div>
        </div>
      </div>`;
    canvas.appendChild(tile);
    const frame = tile.querySelector('iframe');
    const status = tile.querySelector('.st');
    tile.querySelector('.label').onclick = () => {
      document.body.dataset.zoom = document.body.dataset.zoom === 'fit' ? 'full' : 'fit';
      tile.scrollIntoView({ behavior: 'smooth', inline: 'center' });
    };
    await new Promise(res => { frame.onload = res; });
    const w = frame.contentWindow;
    try {
      // wait for the app's functions to exist
      for (let i = 0; i < 100 && typeof w.newTeam !== 'function'; i++) await wait(100);
      w.document.getElementById('launchSplash')?.remove();
      if (drive) w.eval(drive);
      status.textContent = 'live';
    } catch (e) {
      status.textContent = '⚠ ' + String(e.message || e).slice(0, 40);
    }
    await wait(250); // stagger boots — tiles share localStorage
  }
}
async function bootElements() {
  const f = document.getElementById('elFrame');
  await new Promise(res => { if (f.contentDocument?.readyState === 'complete') res(); else f.onload = res; });
  const w = f.contentWindow;
  for (let i = 0; i < 100 && typeof w.newTeam !== 'function'; i++) await wait(100);
  // Every specimen at TRUE pixel size (1:1 — same relative scale as the app);
  // widths only where the design rule fixes them (128 primary, 343 = full width
  // inside a 375 phone with 16px margins).
  const S = (html) => `<div class="spec">${html}</div>`;
  const G = (title, inner) => `<div><div style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:#7d8a9c;text-transform:uppercase;margin-bottom:10px">${title}</div><div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">${inner}</div></div>`;
  const BODY =
    '<style>.spec{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.spec .cap{font:10px/1.5 ui-monospace,Menlo,monospace;color:#5b8ba6;white-space:pre}</style>'
    + '<div id="elRoot" style="padding:22px;display:flex;flex-direction:column;gap:26px;background:#1a1a2e;min-height:100vh">'
    + G('Primary — START width rule (128) + full-width (343)',
        S('<button class="btn btn-g" style="width:128px;margin-top:0;white-space:nowrap">Next →</button>')
      + S('<button class="btn btn-g" style="width:128px;margin-top:0;white-space:nowrap;padding:15px 6px">Save Match ✓</button>')
      + S('<button class="btn btn-g" style="width:343px;margin-top:0">Full-width primary</button>'))
    + G('Secondary / back',
        S('<button class="btn btn-o" style="width:auto;margin-top:0;padding:15px 16px">← Squad</button>')
      + S('<button class="btn btn-o" style="width:auto;margin-top:0;padding:15px 16px">Done</button>')
      + S('<button class="back-btn">← Keeper</button>'))
    + G('ui- family (migration target)',
        S('<button class="ui-btn ui-btn--secondary">Secondary</button>')
      + S('<button class="ui-btn ui-btn--secondary is-plan">+ New Team</button>')
      + S('<button class="ui-btn ui-btn--ghost">Ghost row</button>'))
    + G('Bottom tab bar — live + ghosted (25%)',
        S('<div class="btb-pill" style="background:#0f1422;border-radius:14px"><button class="btb-btn active"><span>Game</span></button><button class="btb-btn"><span>Positions</span></button><button class="btb-btn"><span>Settings</span></button><button class="btb-btn"><span>Roster</span></button></div>')
      + S('<div class="btb-pill" style="background:#0f1422;border-radius:14px;opacity:.25"><button class="btb-btn active"><span>Game</span></button><button class="btb-btn"><span>Positions</span></button><button class="btb-btn"><span>Settings</span></button><button class="btb-btn"><span>Roster</span></button></div>'))
    + G('Game dash tiles',
        S('<button class="gd-btn gd-sub">SUB</button>') + S('<button class="gd-btn">Undo</button>') + S('<button class="gd-btn gd-go" style="width:128px">START</button>'))
    + G('Steppers',
        S('<div class="stepper"><button class="st-btn">−</button><div class="st-val">20</div><button class="st-btn">+</button></div>'))
    + G('Position tags',
        S('<span class="pos-tag pos-tag-gk" style="padding:3px 9px">GK</span>') + S('<span class="pos-tag pos-tag-def" style="padding:3px 9px">DEF</span>') + S('<span class="pos-tag pos-tag-mid" style="padding:3px 9px">MID</span>') + S('<span class="pos-tag pos-tag-wng" style="padding:3px 9px">WNG</span>') + S('<span class="pos-tag pos-tag-fwd" style="padding:3px 9px">FWD</span>'))
    + G('Input + info line',
        S('<input class="input" style="width:343px" placeholder="e.g. Dragonflies U8">')
      + S('<div class="info" style="width:343px">Who&#39;s in goal? The proposed keeper is marked.</div>'))
    + '</div>';
  w.eval(`document.body.innerHTML = ${JSON.stringify(BODY)};
    // annotate each specimen with its actual selector + measured metrics
    document.querySelectorAll('.spec').forEach(sp => {
      const el = sp.firstElementChild;
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      const cls = '.' + String(el.className).trim().split(/\\s+/).join('.');
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = cls + '\\n' + Math.round(r.width) + '×' + Math.round(r.height)
        + ' · r' + parseInt(cs.borderRadius || 0)
        + ' · ' + parseInt(cs.fontSize) + 'px/' + cs.fontWeight
        + ' · pad ' + parseInt(cs.paddingTop) + ',' + parseInt(cs.paddingLeft)
        + (cs.opacity !== '1' ? ' · op ' + cs.opacity : '');
      sp.appendChild(cap);
    });`);
}
function toggleZoom() {
  document.body.dataset.zoom = document.body.dataset.zoom === 'fit' ? 'full' : 'fit';
}
function toggleGrid() {
  document.body.dataset.grid = document.body.dataset.grid === 'on' ? 'off' : 'on';
}
function toggleDevice() {
  const next = document.body.dataset.device === 'phone' ? 'ipad' : 'phone';
  document.body.dataset.device = next;
  document.getElementById('devBtn').textContent = next === 'phone' ? 'iPad' : 'Phone';
  document.getElementById('canvas').innerHTML = '';
  boot(); // reload every tile at the new size — the app lays out responsively per viewport
}
function resetAll() {
  localStorage.clear();
  location.reload();
}
boot();
bootElements();
</script>
</body>
</html>
